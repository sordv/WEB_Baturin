<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
    <title>Батурин ЛБ-12</title>
</head>
<body>
	<p class="name">Выбор пиццы</p>

	<div class="pizza_configurator">
		<div class="pizza_configurator_block">
			<p class="subname">Выберите пиццу:</p>
	
			<select id="pizza_name">
				<option value="pizza_margarita">Маргарита</option>
				<option value="pizza_pepperoni">Пепперони</option>
				<option value="pizza_bavarian">Баварская</option>
			</select>
		</div>
	
		<div class="pizza_configurator_block">
			<p class="subname">Выберите размер:</p>
	
			<select id="pizza_size">
				<option value="size_large">Большая</option>
				<option value="size_small">Маленькая</option>
			</select>
		</div>
	
		<div class="pizza_configurator_block">
			<p class="subname">Дополнительно:</p>

			<div class="checkboxes">
				<label class="checkbox">
                    <input type="checkbox" value="extra_creamy_mozarella">
                    <span>Сливочная моцарелла</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" value="extra_cheese_board">
                    <span>Сырный борт</span>
                </label>
                <label class="checkbox">
                    <input type="checkbox" value="extra_cheddar_parmesan">
                    <span>Чедер и пармезан</span>
                </label>
			</div>
		</div>
	</div>

	<button class="pizza_result_button">Рассчитать стоимость и калорийность собранной пиццы</button>

	<div id="pizza_calculate_result">
		<p id="price_result"></p>
		<p id="calories_result"></p>
	</div>

	<script src="pizza_calculate.js"></script>
</body>
</html>
